[package]
name = "far_linux"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A Far Manager 3 style file manager for Linux terminals"
repository = "https://github.com/lexus2k/far_linux"

[lib]
path = "src/lib.rs"

[[bin]]
name = "far"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.29", features = ["bracketed-paste"] }
unicode-width = "0.2"
encoding_rs = "0.8"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
panic = "unwind"
