[package]
name = "far_linux"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A Far Manager 3 style file manager for Linux terminals"
repository = "https://github.com/lexus2k/far_linux"

[lib]
path = "src/lib.rs"

[[bin]]
name = "far"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.29", features = ["bracketed-paste"] }
unicode-width = "0.2"
encoding_rs = "0.8"
libc = "0.2"
fancy-regex = "0.20"
unicode-normalization = "0.1"
rusqlite = { version = "0.41", features = ["bundled"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy", "parsing"] }

[profile.release]
opt-level = 3
lto = "thin"
panic = "unwind"
